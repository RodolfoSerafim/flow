<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flow ERP</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #183b2d; }
        .topo { height: 62px; padding: 8px 24px; display: flex; align-items: center; background: #fff; }
        .logo { display: block; width: 155px; height: 45px; object-fit: contain; object-position: left center; }
        .layout { min-height: calc(100vh - 62px); display: flex; }
        .menu { width: 220px; flex: 0 0 220px; padding: 18px 12px; background: #075238; }
        .busca { width: 100%; height: 34px; margin-bottom: 20px; padding: 7px 10px; border: 1px solid #cbd8ce; border-radius: 3px; }
        .menu a { display: block; padding: 11px 10px; color: #e7f2e9; text-decoration: none; font-size: 14px; }
        .menu a:hover, .menu a.ativo { color: #fff; background: #087843; }
        .icone { display: inline-block; width: 25px; color: #a8e950; }
        main { flex: 1; min-width: 0; background: #fff; }
        .barra-pagina { min-height: 39px; padding: 9px 14px; background: #f0f0f0; color: #326548; font-size: 13px; }
        .conteudo { min-height: calc(100vh - 101px); padding: 32px; }
        .inicio { display: flex; justify-content: center; align-items: center; }
        .inicio img { display: block; width: min(570px, 80%); height: auto; }
        .painel { max-width: 900px; margin: 0 auto; }
        h1 { margin: 0 0 22px; color: #075238; font-size: 24px; font-weight: 600; }
        .formulario { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 680px; }
        .campo { display: flex; flex-direction: column; gap: 6px; }
        .campo.largo { grid-column: 1 / -1; }
        .campo label { font-size: 14px; }
        .campo input { width: 100%; height: 38px; padding: 8px 10px; border: 1px solid #bdc9c1; border-radius: 3px; }
        .acoes { grid-column: 1 / -1; display: flex; gap: 9px; margin-top: 3px; }
        .opcoes-usuario { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
        .opcao-usuario { min-width: 180px; padding: 14px 18px; }
        .formulario.usuario { max-width: 680px; }
        button { padding: 9px 16px; border: 0; border-radius: 3px; background: #087843; color: white; cursor: pointer; }
        button:hover { background: #075238; }
        button.secundario { background: #68766d; }
        button.perigo { background: #a53c32; }
        .resultado { margin-top: 28px; }
        .resultado h2 { color: #075238; font-size: 17px; font-weight: 600; }
        .lista { width: 100%; border-collapse: collapse; font-size: 14px; }
        .lista th, .lista td { padding: 10px; text-align: left; }
        .lista th { background: #f3f6f3; }
        .vazio { color: #68766d; font-size: 14px; }
        .status { display: inline-block; padding: 3px 8px; border-radius: 10px; background: #e5f3e7; color: #176533; }
        .status.desligado { background: #f4e7e5; color: #963b32; }
        .linha-acoes { display: flex; flex-wrap: wrap; gap: 5px; }
        .linha-acoes button { padding: 6px 9px; font-size: 12px; }
        .mensagem { min-height: 20px; margin-top: 12px; color: #176533; font-size: 14px; }
        [hidden] { display: none !important; }
        @media (max-width: 700px) {
            .topo { height: 56px; padding-left: 14px; }
            .logo { width: 135px; }
            .layout { min-height: calc(100vh - 56px); flex-direction: column; }
            .menu { width: 100%; flex-basis: auto; padding: 8px; display: flex; align-items: center; gap: 4px; overflow-x: auto; }
            .busca { display: none; }
            .menu a { white-space: nowrap; padding: 10px; }
            .icone { width: 19px; }
            .conteudo { min-height: calc(100vh - 135px); padding: 20px 14px; }
            .formulario { grid-template-columns: 1fr; }
            .campo.largo, .acoes { grid-column: auto; }
            .lista { font-size: 12px; }
            .lista th, .lista td { padding: 7px 5px; }
        }
    </style>
</head>
<body>
    <header class="topo"><img class="logo" src="logo-flow-erp.png" alt="Flow ERP"></header>
    <div class="layout">
        <aside class="menu">
            <input class="busca" id="busca-menu" type="search" placeholder="Localizar item menu" aria-label="Localizar item no menu">
            <nav aria-label="Menu principal">
                <a href="#inicio" data-pagina="inicio" class="ativo"><span class="icone">⌂</span>Início</a>
                <a href="#consultas" data-pagina="consultas"><span class="icone">☷</span>Consultas</a>
                <a href="#cadastros" data-pagina="cadastros"><span class="icone">♙</span>Cadastros</a>
                <a href="#usuarios" data-pagina="usuarios"><span class="icone">♙</span>Criar usuário</a>
                <a href="#login" data-pagina="login"><span class="icone">→</span>Entrar</a>
                <a href="#relatorios" data-pagina="relatorios"><span class="icone">▤</span>Relatórios</a>
            </nav>
        </aside>
        <main>
            <div class="barra-pagina" id="titulo-pagina">Início</div>
            <section class="conteudo inicio" id="pagina-inicio"><img src="logo-flow-erp.png" alt="Flow ERP"></section>
            <section class="conteudo" id="pagina-consultas" hidden>
                <div class="painel">
                    <h1>Consulta</h1>
                    <form class="formulario" id="form-consulta">
                        <div class="campo largo"><label for="consulta-nome">Nome</label><input id="consulta-nome" type="text" placeholder="Nome para filtrar" autocomplete="off"></div>
                        <div class="campo"><label for="consulta-inicio">Data de início</label><input id="consulta-inicio" type="date"></div>
                        <div class="campo"><label for="consulta-fim">Data de término</label><input id="consulta-fim" type="date"></div>
                        <div class="acoes"><button type="submit">Consultar</button><button type="reset" class="secundario">Limpar</button></div>
                    </form>
                    <div class="resultado" id="resultado-consulta" aria-live="polite"></div>
                    <div class="mensagem" id="mensagem-consulta"></div>
                </div>
            </section>
            <section class="conteudo" id="pagina-cadastros" hidden>
                <div class="painel">
                    <h1>Cadastro de colaborador</h1>
                    <form class="formulario" id="form-cadastro">
                        <div class="campo largo"><label for="cadastro-nome">Nome</label><input id="cadastro-nome" type="text" required autocomplete="name"></div>
                        <div class="campo"><label for="cadastro-contratacao">Data de contratação</label><input id="cadastro-contratacao" type="date" required></div>
                        <div class="campo"><label for="cadastro-saida">Data de saída</label><input id="cadastro-saida" type="date"></div>
                        <div class="campo largo"><label>Status</label><div class="acoes"><button type="button" id="status-ativo" aria-pressed="true">Ativo</button><button type="button" class="secundario" id="status-desligado" aria-pressed="false">Desligado</button></div></div>
                        <div class="acoes"><button type="submit">Salvar cadastro</button><button type="reset" class="secundario">Limpar</button></div>
                    </form>
                    <div class="mensagem" id="mensagem-cadastro" aria-live="polite"></div>
                    <div class="resultado" id="lista-cadastros"></div>
                </div>
            </section>
            <section class="conteudo" id="pagina-usuarios" hidden>
                <div class="painel">
                    <h1>Criar usuário</h1>
                    <p class="vazio">Escolha o tipo de usuário que deseja cadastrar.</p>
                    <div class="opcoes-usuario">
                        <button type="button" class="opcao-usuario" id="escolher-empresa">Empresa</button>
                        <button type="button" class="opcao-usuario secundario" id="escolher-funcionario">Funcionário</button>
                    </div>
                    <form class="formulario usuario" id="form-empresa" hidden>
                        <div class="campo largo"><label for="empresa-nome">Nome da empresa</label><input id="empresa-nome" type="text" required autocomplete="organization"></div>
                        <div class="campo"><label for="empresa-cnpj">CNPJ</label><input id="empresa-cnpj" type="text" required inputmode="numeric"></div>
                        <div class="campo"><label for="empresa-email">E-mail</label><input id="empresa-email" type="email" required autocomplete="email"></div>
                        <div class="campo"><label for="empresa-login">Login</label><input id="empresa-login" type="text" required autocomplete="username"></div>
                        <div class="campo"><label for="empresa-senha">Senha</label><input id="empresa-senha" type="password" required minlength="6" autocomplete="new-password"></div>
                        <div class="acoes"><button type="submit">Criar empresa</button><button type="reset" class="secundario">Limpar</button></div>
                    </form>
                    <form class="formulario usuario" id="form-funcionario" hidden>
                        <div class="campo largo"><label for="funcionario-nome">Nome completo</label><input id="funcionario-nome" type="text" required autocomplete="name"></div>
                        <div class="campo"><label for="funcionario-email">E-mail</label><input id="funcionario-email" type="email" required autocomplete="email"></div>
                        <div class="campo"><label for="funcionario-cargo">Cargo</label><input id="funcionario-cargo" type="text" required autocomplete="organization-title"></div>
                        <div class="acoes"><button type="submit">Criar funcionário</button><button type="reset" class="secundario">Limpar</button></div>
                    </form>
                    <div class="mensagem" id="mensagem-usuario" aria-live="polite"></div>
                </div>
            </section>
            <section class="conteudo" id="pagina-login" hidden>
                <div class="painel">
                    <h1>Entrar na área da empresa</h1>
                    <form class="formulario usuario" id="form-login">
                        <div class="campo largo"><label for="login-usuario">Login</label><input id="login-usuario" type="text" required autocomplete="username"></div>
                        <div class="campo largo"><label for="login-senha">Senha</label><input id="login-senha" type="password" required autocomplete="current-password"></div>
                        <div class="acoes"><button type="submit">Entrar</button></div>
                    </form>
                    <div class="mensagem" id="mensagem-login" aria-live="polite"></div>
                </div>
            </section>
            <section class="conteudo" id="pagina-empresa" hidden>
                <div class="painel">
                    <h1 id="empresa-titulo">Área da empresa</h1>
                    <p class="vazio" id="empresa-login-info"></p>
                    <h2>Funcionários</h2>
                    <form class="formulario usuario" id="form-funcionario-empresa">
                        <div class="campo largo"><label for="empresa-funcionario-nome">Nome completo</label><input id="empresa-funcionario-nome" type="text" required autocomplete="name"></div>
                        <div class="campo"><label for="empresa-funcionario-email">E-mail</label><input id="empresa-funcionario-email" type="email" required autocomplete="email"></div>
                        <div class="campo"><label for="empresa-funcionario-cargo">Cargo</label><input id="empresa-funcionario-cargo" type="text" required autocomplete="organization-title"></div>
                        <div class="acoes"><button type="submit">Cadastrar funcionário</button><button type="reset" class="secundario">Limpar</button></div>
                    </form>
                    <div class="mensagem" id="mensagem-funcionario" aria-live="polite"></div>
                    <div class="resultado" id="lista-funcionarios"></div>
                    <button type="button" class="secundario" id="sair-empresa">Sair</button>
                </div>
            </section>
            <section class="conteudo" id="pagina-relatorios" hidden>
                <div class="painel"><h1>Relatórios</h1><p class="vazio">Use a consulta para localizar os registros cadastrados.</p><button type="button" id="relatorio-csv">Baixar relatório CSV</button><div class="mensagem" id="mensagem-relatorio"></div></div>
            </section>
        </main>
    </div>
    <script>
        const paginas = ['inicio', 'consultas', 'cadastros', 'usuarios', 'login', 'empresa', 'relatorios'];
        const titulo = document.getElementById('titulo-pagina');
        function abrirPagina(nome) {
            if (!paginas.includes(nome)) nome = 'inicio';
            paginas.forEach(p => document.getElementById('pagina-' + p).hidden = p !== nome);
            document.querySelectorAll('.menu nav a').forEach(a => a.classList.toggle('ativo', a.dataset.pagina === nome));
            titulo.textContent = nome === 'cadastros' ? 'Cadastros' : nome === 'usuarios' ? 'Criar usuário' : nome.charAt(0).toUpperCase() + nome.slice(1);
            history.replaceState(null, '', '#' + nome);
            if (nome === 'cadastros') desenharCadastros();
            if (nome === 'empresa') desenharEmpresa();
        }
        document.querySelectorAll('.menu nav a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); abrirPagina(a.dataset.pagina); }));
        document.getElementById('busca-menu').addEventListener('input', e => {
            const q = e.target.value.trim().toLocaleLowerCase('pt-BR');
            document.querySelectorAll('.menu nav a').forEach(a => a.hidden = !a.textContent.toLocaleLowerCase('pt-BR').includes(q));
        });
        function lerRegistros() { try { return JSON.parse(localStorage.getItem('flow-colaboradores') || '[]'); } catch (_) { return []; } }
        function gravarRegistros(registros) { localStorage.setItem('flow-colaboradores', JSON.stringify(registros)); }
        function lerUsuarios() { try { return JSON.parse(localStorage.getItem('flow-usuarios') || '[]'); } catch (_) { return []; } }
        function gravarUsuarios(usuario) {
            const usuarios = JSON.parse(localStorage.getItem('flow-usuarios') || '[]');
            usuarios.push(usuario);
            localStorage.setItem('flow-usuarios', JSON.stringify(usuarios));
        }
        function usuarioAtual() { return lerUsuarios().find(u => u.id === sessionStorage.getItem('flow-usuario-atual')); }
        function entrarEmpresa(login, senha) {
            const usuario = lerUsuarios().find(u => u.tipo === 'Empresa' && u.login === login && u.senha === senha);
            if (!usuario) return false;
            sessionStorage.setItem('flow-usuario-atual', usuario.id);
            abrirPagina('empresa');
            return true;
        }
        function mostrarFormularioUsuario(tipo) {
            document.getElementById('form-empresa').hidden = tipo !== 'empresa';
            document.getElementById('form-funcionario').hidden = tipo !== 'funcionario';
            document.getElementById('escolher-empresa').className = tipo === 'empresa' ? 'opcao-usuario' : 'opcao-usuario secundario';
            document.getElementById('escolher-funcionario').className = tipo === 'funcionario' ? 'opcao-usuario' : 'opcao-usuario secundario';
            document.getElementById('mensagem-usuario').textContent = '';
        }
        document.getElementById('escolher-empresa').addEventListener('click', () => mostrarFormularioUsuario('empresa'));
        document.getElementById('escolher-funcionario').addEventListener('click', () => mostrarFormularioUsuario('funcionario'));
        document.getElementById('form-empresa').addEventListener('submit', e => {
            e.preventDefault();
            const usuario = { id: String(Date.now()), tipo: 'Empresa', nome: document.getElementById('empresa-nome').value.trim(), cnpj: document.getElementById('empresa-cnpj').value.trim(), email: document.getElementById('empresa-email').value.trim(), login: document.getElementById('empresa-login').value.trim(), senha: document.getElementById('empresa-senha').value, funcionarios: [] };
            if (lerUsuarios().some(u => u.login === usuario.login)) { document.getElementById('mensagem-usuario').textContent = 'Esse login já está em uso.'; return; }
            gravarUsuarios(usuario);
            sessionStorage.setItem('flow-usuario-atual', usuario.id);
            e.target.reset();
            abrirPagina('empresa');
        });
        document.getElementById('form-funcionario').addEventListener('submit', e => {
            e.preventDefault();
            gravarUsuarios({ tipo: 'Funcionário', nome: document.getElementById('funcionario-nome').value.trim(), email: document.getElementById('funcionario-email').value.trim(), cargo: document.getElementById('funcionario-cargo').value.trim() });
            document.getElementById('mensagem-usuario').textContent = 'Funcionário criado neste navegador.';
            e.target.reset();
        });
        document.getElementById('form-login').addEventListener('submit', e => {
            e.preventDefault();
            const entrou = entrarEmpresa(document.getElementById('login-usuario').value.trim(), document.getElementById('login-senha').value);
            document.getElementById('mensagem-login').textContent = entrou ? '' : 'Login ou senha inválidos.';
        });
        function desenharEmpresa() {
            const usuario = usuarioAtual();
            if (!usuario) { abrirPagina('login'); return; }
            document.getElementById('empresa-titulo').textContent = usuario.nome;
            document.getElementById('empresa-login-info').textContent = 'Funcionários vinculados a esta empresa.';
            const el = document.getElementById('lista-funcionarios');
            if (!usuario.funcionarios.length) { el.innerHTML = '<p class="vazio">Nenhum funcionário cadastrado.</p>'; return; }
            el.innerHTML = '<table class="lista"><thead><tr><th>Nome</th><th>E-mail</th><th>Cargo</th><th>Ação</th></tr></thead><tbody>' + usuario.funcionarios.map(f => `<tr><td>${escapar(f.nome)}</td><td>${escapar(f.email)}</td><td>${escapar(f.cargo)}</td><td><button type="button" class="perigo" data-excluir-funcionario="${f.id}">Excluir</button></td></tr>`).join('') + '</tbody></table>';
            el.querySelectorAll('[data-excluir-funcionario]').forEach(b => b.addEventListener('click', () => {
                const usuarios = lerUsuarios(); const conta = usuarios.find(u => u.id === usuario.id);
                conta.funcionarios = conta.funcionarios.filter(f => f.id !== b.dataset.excluirFuncionario);
                localStorage.setItem('flow-usuarios', JSON.stringify(usuarios)); desenharEmpresa();
            }));
        }
        document.getElementById('form-funcionario-empresa').addEventListener('submit', e => {
            e.preventDefault();
            const usuarios = lerUsuarios(); const usuario = usuarios.find(u => u.id === sessionStorage.getItem('flow-usuario-atual'));
            if (!usuario) return abrirPagina('login');
            usuario.funcionarios.push({ id: String(Date.now()), nome: document.getElementById('empresa-funcionario-nome').value.trim(), email: document.getElementById('empresa-funcionario-email').value.trim(), cargo: document.getElementById('empresa-funcionario-cargo').value.trim() });
            localStorage.setItem('flow-usuarios', JSON.stringify(usuarios));
            document.getElementById('mensagem-funcionario').textContent = 'Funcionário cadastrado nesta empresa.';
            e.target.reset(); desenharEmpresa();
        });
        document.getElementById('sair-empresa').addEventListener('click', () => { sessionStorage.removeItem('flow-usuario-atual'); abrirPagina('login'); });
        let statusSelecionado = 'Ativo';
        function escolherStatus(status) {
            statusSelecionado = status;
            document.getElementById('status-ativo').className = status === 'Ativo' ? '' : 'secundario';
            document.getElementById('status-desligado').className = status === 'Desligado' ? 'perigo' : 'secundario';
            document.getElementById('status-ativo').setAttribute('aria-pressed', status === 'Ativo');
            document.getElementById('status-desligado').setAttribute('aria-pressed', status === 'Desligado');
        }
        document.getElementById('status-ativo').addEventListener('click', () => escolherStatus('Ativo'));
        document.getElementById('status-desligado').addEventListener('click', () => escolherStatus('Desligado'));
        document.getElementById('form-cadastro').addEventListener('reset', () => setTimeout(() => escolherStatus('Ativo')));
        document.getElementById('form-cadastro').addEventListener('submit', e => {
            e.preventDefault();
            const registro = { id: Date.now(), nome: document.getElementById('cadastro-nome').value.trim(), contratacao: document.getElementById('cadastro-contratacao').value, saida: document.getElementById('cadastro-saida').value, status: statusSelecionado };
            const registros = lerRegistros(); registros.push(registro); gravarRegistros(registros);
            document.getElementById('mensagem-cadastro').textContent = 'Cadastro salvo neste navegador.';
            e.target.reset(); desenharCadastros();
        });
        function dataPt(data) { if (!data) return '—'; const [a,m,d] = data.split('-'); return `${d}/${m}/${a}`; }
        function escapar(texto) { return String(texto).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function desenharCadastros() {
            const registros = lerRegistros(); const el = document.getElementById('lista-cadastros');
            if (!registros.length) { el.innerHTML = '<h2>Cadastros</h2><p class="vazio">Nenhum colaborador cadastrado.</p>'; return; }
            el.innerHTML = '<h2>Cadastros</h2><table class="lista"><thead><tr><th>Nome</th><th>Contratação</th><th>Saída</th><th>Status</th><th>Ação</th></tr></thead><tbody>' + registros.map(r => `<tr><td>${escapar(r.nome)}</td><td>${dataPt(r.contratacao)}</td><td>${dataPt(r.saida)}</td><td><span class="status ${r.status === 'Desligado' ? 'desligado' : ''}">${r.status}</span></td><td><div class="linha-acoes"><button type="button" data-toggle="${r.id}">${r.status === 'Ativo' ? 'Desligar' : 'Ativar'}</button><button type="button" class="perigo" data-excluir="${r.id}">Excluir</button></div></td></tr>`).join('') + '</tbody></table>';
            el.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => { const lista = lerRegistros(); const r = lista.find(x => x.id == b.dataset.toggle); if (r) r.status = r.status === 'Ativo' ? 'Desligado' : 'Ativo'; gravarRegistros(lista); desenharCadastros(); }));
            el.querySelectorAll('[data-excluir]').forEach(b => b.addEventListener('click', () => { gravarRegistros(lerRegistros().filter(x => x.id != b.dataset.excluir)); desenharCadastros(); }));
        }
        document.getElementById('form-consulta').addEventListener('reset', () => { document.getElementById('resultado-consulta').innerHTML = ''; document.getElementById('mensagem-consulta').textContent = ''; });
        document.getElementById('form-consulta').addEventListener('submit', e => {
            e.preventDefault();
            const nome = document.getElementById('consulta-nome').value.trim().toLocaleLowerCase('pt-BR');
            const inicio = document.getElementById('consulta-inicio').value; const fim = document.getElementById('consulta-fim').value;
            const encontrados = lerRegistros().filter(r => (!nome || r.nome.toLocaleLowerCase('pt-BR').includes(nome)) && (!inicio || r.contratacao >= inicio) && (!fim || r.contratacao <= fim));
            const el = document.getElementById('resultado-consulta');
            if (!encontrados.length) { el.innerHTML = '<p class="vazio">Nenhum registro encontrado.</p>'; return; }
            el.innerHTML = '<table class="lista"><thead><tr><th>Nome</th><th>Contratação</th><th>Saída</th><th>Status</th></tr></thead><tbody>' + encontrados.map(r => `<tr><td>${escapar(r.nome)}</td><td>${dataPt(r.contratacao)}</td><td>${dataPt(r.saida)}</td><td>${escapar(r.status)}</td></tr>`).join('') + '</tbody></table>';
        });
        document.getElementById('relatorio-csv').addEventListener('click', () => {
            const rows = [['Nome','Data de contratação','Data de saída','Status'], ...lerRegistros().map(r => [r.nome,r.contratacao,r.saida,r.status])];
            const csv = '\ufeff' + rows.map(row => row.map(v => '"' + String(v || '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
            const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); link.download = 'relatorio-flow.csv'; link.click(); URL.revokeObjectURL(link.href);
            document.getElementById('mensagem-relatorio').textContent = 'Relatório baixado.';
        });
        abrirPagina(location.hash.slice(1) || 'inicio');
